[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fartmagic"
version = "0.1.0"
description = "Isolated Midnight neural experiment repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["huggingface_hub>=0.26"]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
